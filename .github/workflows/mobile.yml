name: Mobile app

on:
  push:
    branches: [main, cursor/uk-immigration-route-planner-cc43]
    paths:
      - "mobile/**"
      - "lib/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "lib/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
